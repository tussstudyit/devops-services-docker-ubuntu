services:
  nginx:
    image: nginx:alpine
    container_name: devops_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - devops_net

  app:
    build: ./app
    container_name: devops_app
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secret123
      - DB_NAME=devops_db
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops_net

  db:
    image: mysql:8.0
    container_name: devops_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: devops_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devops_net

networks:
  devops_net:
    driver: bridge

volumes:
  mysql_data:
